server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # MapLibre's background worker is an ES module; browsers require a JS MIME type.
    location ~ \.mjs$ {
        types { text/javascript mjs; }
        expires 7d;
    }

    # Pre-gzipped data layers: the app decompresses them itself, so serve as-is.
    location /data/ {
        types { application/json json; application/octet-stream gz; }
        expires 1h;
    }

    location /assets/ {
        expires 7d;
    }
}
